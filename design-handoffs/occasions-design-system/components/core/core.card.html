<!-- @dsCard group="Components" viewport="700x420" name="Core — Button, Badge, Avatar, Card" subtitle="Actions, status pills, avatars & surfaces" -->
<!DOCTYPE html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<style>
  body{margin:0;padding:24px;background:var(--surface-page);font-family:var(--font-sans)}
  .sec{margin-bottom:22px}
  .h{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text-muted);margin-bottom:12px}
  .row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
</style></head><body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel">
  const { Button, IconButton, Badge, Avatar, Card, CardHeader } = window.AIBizConnectDesignSystem_d948fa;
  const Plus = () => <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round"/></svg>;
  const Dots = () => <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><circle cx="5" cy="12" r="1.6" fill="currentColor"/><circle cx="12" cy="12" r="1.6" fill="currentColor"/><circle cx="19" cy="12" r="1.6" fill="currentColor"/></svg>;
  function Demo(){
    return (
      <div>
        <div className="sec"><div className="h">Buttons</div>
          <div className="row">
            <Button variant="primary" leftIcon={<Plus/>}>New contact</Button>
            <Button variant="secondary">Import</Button>
            <Button variant="ghost">Cancel</Button>
            <Button variant="danger">Delete</Button>
            <Button variant="primary" size="sm">Small</Button>
            <Button variant="primary" loading>Saving</Button>
            <Button variant="primary" disabled>Disabled</Button>
            <IconButton label="More" variant="secondary"><Dots/></IconButton>
          </div>
        </div>
        <div className="sec"><div className="h">Badges</div>
          <div className="row">
            <Badge tone="brand">Pro</Badge>
            <Badge tone="success" dot>Active</Badge>
            <Badge tone="warning" dot>Follow-up</Badge>
            <Badge tone="danger" solid>Overdue</Badge>
            <Badge tone="neutral">Draft</Badge>
          </div>
        </div>
        <div className="sec"><div className="h">Avatars</div>
          <div className="row">
            <Avatar name="Dana Ruiz" size="lg" status="online"/>
            <Avatar name="Marcus Lee" size="md"/>
            <Avatar name="Priya N" size="md" status="away"/>
            <Avatar name="JP" size="sm"/>
          </div>
        </div>
        <div className="sec" style={{marginBottom:0}}><div className="h">Card</div>
          <Card style={{maxWidth:340}}>
            <CardHeader title="Q2 Pipeline" subtitle="Closing this month" action={<Badge tone="brand">+12%</Badge>}/>
            <div style={{fontSize:14,color:'var(--text-body)'}}>14 deals · $48,920 weighted value</div>
          </Card>
        </div>
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
</script>
</body></html>
