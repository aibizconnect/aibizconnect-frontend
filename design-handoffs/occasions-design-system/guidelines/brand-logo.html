<!-- @dsCard group="Brand" viewport="700x220" name="Logo — primary" subtitle="Play-button mark + wordmark on light" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;padding:28px;background:var(--surface-card);font-family:var(--font-sans);display:flex;align-items:center;gap:40px}
  .col{display:flex;flex-direction:column;gap:8px;align-items:center}
  .wm{height:62px}
  .mark{height:84px}
  .tag{font-size:11px;font-weight:600;color:var(--text-muted)}
  .divider{width:1px;height:120px;background:var(--border-subtle)}
  .cap{font-size:12px;color:var(--text-muted);max-width:210px;line-height:1.5}
  .cap b{color:var(--text-heading)}
</style></head><body>
  <div class="col">
    <img class="wm" src="../assets/logo-wordmark-blue.png" alt="AIBizConnect">
    <span class="tag">Full logo</span>
  </div>
  <div class="divider"></div>
  <div class="col">
    <img class="mark" src="../assets/logo-mark.png" alt="AIBizConnect mark">
    <span class="tag">App icon / mark</span>
  </div>
  <div class="divider"></div>
  <div class="cap"><b>Mark</b> = play triangle signalling action &amp; momentum. The wordmark already carries the gray triangle — never add a second mark beside it. Clear space ≥ the inner triangle.</div>
</body></html>
