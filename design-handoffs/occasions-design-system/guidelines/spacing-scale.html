<!-- @dsCard group="Spacing" viewport="700x210" name="Spacing scale" subtitle="4px base · --space-1 → --space-16" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;padding:22px 24px;background:var(--surface-card);font-family:var(--font-sans)}
  .r{display:flex;align-items:center;gap:14px;padding:3px 0}
  .bar{height:16px;background:var(--blue-200);border-radius:3px}
  .tok{font-family:var(--font-mono);font-size:11px;color:var(--text-muted);width:160px}
</style></head><body>
  <div class="r"><div class="bar" style="width:4px"></div><span class="tok">--space-1 · 4px</span></div>
  <div class="r"><div class="bar" style="width:8px"></div><span class="tok">--space-2 · 8px</span></div>
  <div class="r"><div class="bar" style="width:12px"></div><span class="tok">--space-3 · 12px</span></div>
  <div class="r"><div class="bar" style="width:16px"></div><span class="tok">--space-4 · 16px</span></div>
  <div class="r"><div class="bar" style="width:24px"></div><span class="tok">--space-6 · 24px</span></div>
  <div class="r"><div class="bar" style="width:32px"></div><span class="tok">--space-8 · 32px</span></div>
  <div class="r"><div class="bar" style="width:48px"></div><span class="tok">--space-12 · 48px</span></div>
  <div class="r"><div class="bar" style="width:64px"></div><span class="tok">--space-16 · 64px</span></div>
</body></html>
