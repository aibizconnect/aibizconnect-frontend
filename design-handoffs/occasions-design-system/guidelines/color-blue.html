<!-- @dsCard group="Colors" viewport="700x190" name="Brand blue scale" subtitle="Primary indigo — pulled from the play-button mark" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;padding:20px;background:var(--surface-card);font-family:var(--font-sans)}
  .row{display:flex;gap:8px}
  .sw{flex:1;display:flex;flex-direction:column;gap:6px}
  .chip{height:64px;border-radius:var(--radius-md);box-shadow:var(--shadow-xs)}
  .name{font-size:11px;font-weight:600;color:var(--text-heading)}
  .hex{font-family:var(--font-mono);font-size:10px;color:var(--text-muted)}
  .lbl{font-size:10px;color:var(--white);opacity:.85;font-weight:600;padding:6px 8px}
</style></head><body>
<div class="row">
  <div class="sw"><div class="chip" style="background:var(--blue-50)"></div><div class="name">50</div><div class="hex">#F1F2FE</div></div>
  <div class="sw"><div class="chip" style="background:var(--blue-100)"></div><div class="name">100</div><div class="hex">#E2E4FA</div></div>
  <div class="sw"><div class="chip" style="background:var(--blue-200)"></div><div class="name">200</div><div class="hex">#B4B9EC</div></div>
  <div class="sw"><div class="chip" style="background:var(--blue-300)"></div><div class="name">300</div><div class="hex">#7C84D6</div></div>
  <div class="sw"><div class="chip" style="background:var(--blue-400)"><span class="lbl">400</span></div><div class="name">400 · light stop</div><div class="hex">#555FC4</div></div>
  <div class="sw"><div class="chip" style="background:var(--blue-500)"><span class="lbl">500</span></div><div class="name">500 · primary</div><div class="hex">#3D49C4</div></div>
  <div class="sw"><div class="chip" style="background:var(--blue-600)"><span class="lbl">600</span></div><div class="name">600 · dark stop</div><div class="hex">#2F399D</div></div>
  <div class="sw"><div class="chip" style="background:var(--blue-700)"><span class="lbl">700</span></div><div class="name">700</div><div class="hex">#262E82</div></div>
  <div class="sw"><div class="chip" style="background:var(--blue-900)"><span class="lbl">900</span></div><div class="name">900</div><div class="hex">#12164A</div></div>
</div>
</body></html>
