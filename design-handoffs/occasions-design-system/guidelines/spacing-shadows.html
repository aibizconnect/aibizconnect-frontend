<!-- @dsCard group="Spacing" viewport="700x200" name="Elevation & shadows" subtitle="Soft cool-tinted shadow ramp + focus ring" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;padding:28px 24px;background:var(--surface-card);font-family:var(--font-sans);display:flex;gap:20px;align-items:center;flex-wrap:wrap}
  .col{display:flex;flex-direction:column;gap:10px;align-items:center}
  .box{width:84px;height:60px;background:var(--white);border-radius:var(--radius-md)}
  .tok{font-family:var(--font-mono);font-size:10px;color:var(--text-muted)}
</style></head><body>
  <div class="col"><div class="box" style="box-shadow:var(--shadow-xs)"></div><span class="tok">xs</span></div>
  <div class="col"><div class="box" style="box-shadow:var(--shadow-sm)"></div><span class="tok">sm</span></div>
  <div class="col"><div class="box" style="box-shadow:var(--shadow-md)"></div><span class="tok">md</span></div>
  <div class="col"><div class="box" style="box-shadow:var(--shadow-lg)"></div><span class="tok">lg</span></div>
  <div class="col"><div class="box" style="box-shadow:var(--shadow-xl)"></div><span class="tok">xl</span></div>
  <div class="col"><div class="box" style="box-shadow:var(--shadow-brand)"></div><span class="tok">brand</span></div>
  <div class="col"><div class="box" style="box-shadow:var(--ring-focus)"></div><span class="tok">focus ring</span></div>
</body></html>
