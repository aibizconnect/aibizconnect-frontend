<!-- @dsCard group="Type" viewport="700x170" name="Eyebrow, label & mono" subtitle="Overlines, UI labels, numeric/mono data" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;padding:24px;background:var(--surface-card);font-family:var(--font-sans);display:flex;gap:40px;align-items:center}
  .col{display:flex;flex-direction:column;gap:10px}
  .label{font-size:14px;font-weight:600;color:var(--text-heading)}
  .mono{font-family:var(--font-mono);font-size:15px;color:var(--text-strong);font-weight:500}
  .cap{font-family:var(--font-mono);font-size:11px;color:var(--text-muted)}
</style></head><body>
  <div class="col">
    <span class="eyebrow">Marketing Suite</span>
    <span class="label">Pipeline value</span>
    <span class="cap">eyebrow · uppercase · 0.08em</span>
  </div>
  <div class="col">
    <span class="mono">$48,920.00</span>
    <span class="mono">+12.4% · 327 leads</span>
    <span class="cap">Roboto Mono · tabular data</span>
  </div>
</body></html>
