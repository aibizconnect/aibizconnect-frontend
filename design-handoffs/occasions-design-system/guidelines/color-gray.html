<!-- @dsCard group="Colors" viewport="700x190" name="Neutral gray scale" subtitle="Cool-leaning grays for text, borders & surfaces" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;padding:20px;background:var(--surface-card);font-family:var(--font-sans)}
  .row{display:flex;gap:8px}
  .sw{flex:1;display:flex;flex-direction:column;gap:6px}
  .chip{height:64px;border-radius:var(--radius-md);box-shadow:var(--shadow-xs)}
  .name{font-size:11px;font-weight:600;color:var(--text-heading)}
  .hex{font-family:var(--font-mono);font-size:10px;color:var(--text-muted)}
</style></head><body>
<div class="row">
  <div class="sw"><div class="chip" style="background:var(--white);border:1px solid var(--border-subtle)"></div><div class="name">white</div><div class="hex">#FFFFFF</div></div>
  <div class="sw"><div class="chip" style="background:var(--gray-50)"></div><div class="name">50</div><div class="hex">#F8F9FC</div></div>
  <div class="sw"><div class="chip" style="background:var(--gray-100)"></div><div class="name">100</div><div class="hex">#F2F3F7</div></div>
  <div class="sw"><div class="chip" style="background:var(--gray-200)"></div><div class="name">200</div><div class="hex">#E8E9EF</div></div>
  <div class="sw"><div class="chip" style="background:var(--gray-300)"></div><div class="name">300</div><div class="hex">#D6D7DE</div></div>
  <div class="sw"><div class="chip" style="background:var(--gray-400)"></div><div class="name">400</div><div class="hex">#B6B7BD</div></div>
  <div class="sw"><div class="chip" style="background:var(--gray-500)"></div><div class="name">500 · brand</div><div class="hex">#909094</div></div>
  <div class="sw"><div class="chip" style="background:var(--gray-700)"></div><div class="name">700</div><div class="hex">#44454E</div></div>
  <div class="sw"><div class="chip" style="background:var(--gray-900)"></div><div class="name">900</div><div class="hex">#181920</div></div>
</div>
</body></html>
