<!-- @dsCard group="Colors" viewport="700x180" name="Brand gradient & navy" subtitle="The play-button gradient and deep wordmark navy" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;padding:20px;background:var(--surface-card);font-family:var(--font-sans);display:flex;gap:14px}
  .panel{flex:1;border-radius:var(--radius-lg);box-shadow:var(--shadow-sm);height:110px;display:flex;flex-direction:column;justify-content:flex-end;padding:14px}
  .t{color:var(--white);font-weight:700;font-size:13px}
  .s{color:rgba(255,255,255,.8);font-family:var(--font-mono);font-size:10px;margin-top:3px}
</style></head><body>
  <div class="panel" style="background:var(--gradient-brand)">
    <div class="t">--gradient-brand</div><div class="s">135° · #2F399D → #555FC4</div></div>
  <div class="panel" style="background:var(--navy-900)">
    <div class="t">--navy-900 · wordmark</div><div class="s">#090966</div></div>
  <div class="panel" style="background:var(--blue-500)">
    <div class="t">--color-primary</div><div class="s">#3D49C4</div></div>
</body></html>
