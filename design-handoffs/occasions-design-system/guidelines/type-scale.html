<!-- @dsCard group="Type" viewport="700x300" name="Type scale" subtitle="xs → 5xl ramp with token names" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;padding:20px 24px;background:var(--surface-card);font-family:var(--font-sans)}
  .r{display:flex;align-items:baseline;gap:16px;padding:5px 0;border-bottom:1px solid var(--border-subtle)}
  .r:last-child{border:0}
  .s{font-family:var(--font-display);color:var(--text-heading);font-weight:600;letter-spacing:-0.01em;white-space:nowrap}
  .tok{font-family:var(--font-mono);font-size:11px;color:var(--text-muted);margin-left:auto}
</style></head><body>
  <div class="r"><span class="s" style="font-size:48px">Aa</span><span class="tok">--text-4xl · 48px</span></div>
  <div class="r"><span class="s" style="font-size:38px">Aa</span><span class="tok">--text-3xl · 38px</span></div>
  <div class="r"><span class="s" style="font-size:30px">Aa</span><span class="tok">--text-2xl · 30px</span></div>
  <div class="r"><span class="s" style="font-size:24px">Aa</span><span class="tok">--text-xl · 24px</span></div>
  <div class="r"><span class="s" style="font-size:20px">Aa</span><span class="tok">--text-lg · 20px</span></div>
  <div class="r"><span class="s" style="font-size:16px">Aa</span><span class="tok">--text-base · 16px</span></div>
  <div class="r"><span class="s" style="font-size:14px">Aa</span><span class="tok">--text-sm · 14px</span></div>
  <div class="r"><span class="s" style="font-size:12px">Aa</span><span class="tok">--text-xs · 12px</span></div>
</body></html>
